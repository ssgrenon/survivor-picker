[project]
name = "survivor-picker"
version = "0.1.0"
description = "NFL survivor pool picker utilizing historical data to fine tune algorithm"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.1",
    "requests>=2.28",
    "numpy>=1.24",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["data*", "models*", "strategy*", "backtest*"]
